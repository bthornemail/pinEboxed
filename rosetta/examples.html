  <script>
    const svg = document.getElementById("svg-object")
    const svgDoc = svg.contentDocument;
    console.log(svg);
    svg.addEventListener("click", (evt) => {
      switch (evt.type) {
        case "click":
          alert(console.log(svgDoc));
          break;
      }
    });
    function myRect(x, y, w, h, message) {
      this.message = message;

      this.rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      this.rect.setAttributeNS(null, "x", x);
      this.rect.setAttributeNS(null, "y", y);
      this.rect.setAttributeNS(null, "width", w);
      this.rect.setAttributeNS(null, "height", h);
      document.documentElement.appendChild(this.rect);

      this.rect.addEventListener("click", this);

      this.handleEvent = (evt) => {
        switch (evt.type) {
          case "click":
            alert(this.message);
            break;
        }
      };
    }
    myRect(100, 200, 300, 400, "Hello World")
  </script>
  <script>
    const eventSource = new EventSource('/events');

    eventSource.onopen = () => {
      console.log('Connected to SSE');
    };

    // Handle named events
    eventSource.addEventListener('connected', (event) => {
      const data = JSON.parse(event.data);
      console.log('Connected with client ID:', data.clientId);
    });

    eventSource.addEventListener('update', (event) => {
      const data = JSON.parse(event.data);
      console.log('Received update:', data);
    });

    // Handle connection errors
    eventSource.onerror = (error) => {
      console.error('SSE error:', error);

      if (eventSource.readyState === EventSource.CONNECTING) {
        console.log('Connection lost, reconnecting automatically');
      } else if (eventSource.readyState === EventSource.CLOSED) {
        console.log('Connection closed');
      }
    };
  </script>
